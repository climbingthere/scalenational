  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Leave a Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon-32.png">
  <style>
    :root {
      --brand: #FF5A1F;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Urbanist', sans-serif;
      background: #0D0D0D;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 36px;
      text-align: center;
      box-shadow: 0 4px 32px rgba(0,0,0,0.18);
    }
    .loading-state {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #E0E0E0;
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .state { display: none; }
    .state.active { display: block; }
    .logo-img {
      max-height: 56px;
      max-width: 180px;
      object-fit: contain;
      margin: 0 auto 20px;
      display: block;
    }
    .biz-name-fallback {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0D0D0D;
      margin-bottom: 20px;
    }
    .greeting {
      font-size: 1rem;
      color: #777;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
      color: #0D0D0D;
    }
    .subtext {
      font-size: 1rem;
      color: #555;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    /* Stars */
    .stars {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
    }
    .star {
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .star:hover { transform: scale(1.15); }
    .star svg {
      width: 52px;
      height: 52px;
      fill: #E0E0E0;
      transition: fill 0.15s ease;
    }
    .star.filled svg { fill: var(--brand); }
    /* Icons */
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #FFF2ED;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .icon-wrap svg {
      width: 36px;
      height: 36px;
      stroke: var(--brand);
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* Form inputs */
    .form-field {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #E0E0E0;
      border-radius: 8px;
      font-family: 'Urbanist', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 12px;
      -webkit-appearance: none;
      appearance: none;
      background: #fff;
    }
    .form-field:focus { border-color: var(--brand); }
    textarea.form-field {
      min-height: 100px;
      resize: vertical;
    }
    select.form-field {
      color: #555;
    }
    /* Button */
    .btn {
      display: inline-block;
      background: var(--brand);
      color: #fff;
      font-family: 'Urbanist', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
      width: 100%;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .btn.loading { position: relative; color: transparent; }
    .btn.loading::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 20px; height: 20px;
      margin: -10px 0 0 -10px;
      border: 3px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .powered {
      margin-top: 24px;
      text-align: center;
      font-size: 0.75rem;
      color: #666;
    }
    .error-msg {
      color: #d32f2f;
      font-size: 0.85rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- Loading -->
    <div id="state-loading" class="state active">
      <div class="loading-state">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- State 1: Star Rating -->
    <div id="state-rating" class="state">
      <div id="logo-container"></div>
      <p class="greeting" id="greeting" style="display:none;"></p>
      <h1 id="heading"></h1>
      <div class="stars" id="stars">
        <div class="star" data-value="1"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
        <div class="star" data-value="2"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
        <div class="star" data-value="3"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
        <div class="star" data-value="4"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
        <div class="star" data-value="5"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
      </div>
    </div>

    <!-- State 2: Unhappy Path -->
    <div id="state-unhappy" class="state">
      <h1>Sorry to hear that.</h1>
      <p class="subtext">Your feedback helps us improve. What went wrong?</p>
      <select id="feedback-reason" class="form-field">
        <option value="">Select a reason...</option>
        <option value="Quality of work">Quality of work</option>
        <option value="Scheduling or timing">Scheduling or timing</option>
        <option value="Communication">Communication</option>
        <option value="Pricing">Pricing</option>
        <option value="Damage or safety concern">Damage or safety concern</option>
        <option value="Other">Other</option>
      </select>
      <input type="text" id="feedback-name" class="form-field" placeholder="Name (optional)">
      <input type="email" id="feedback-email" class="form-field" placeholder="Email (optional)">
      <textarea id="feedback" class="form-field" placeholder="Tell us more..."></textarea>
      <button class="btn" id="btn-feedback">Submit</button>
      <p class="error-msg" id="feedback-error" style="display:none;"></p>
    </div>

    <!-- State 3: Confirmation -->
    <div id="state-thanks" class="state">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <h1>Thank you for your feedback.</h1>
      <p class="subtext">We take every review seriously and will be in touch.</p>
    </div>

  </div>

  <div class="powered">Powered by Scale National</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const lid = params.get('lid') || '';
    const cid = params.get('cid') || '';
    const name = params.get('name') || '';
    const service = params.get('service') || '';

    let selectedRating = 0;
    let config = { bizName: 'Us', logoUrl: '', googleUrl: '', brandColor: '#FF5A1F' };

    async function init() {
      try {
        if (lid) {
          const res = await fetch(`/functions/review-config?lid=${encodeURIComponent(lid)}`);
          if (res.ok) {
            config = await res.json();
          }
        }
      } catch (e) {
        // use defaults
      }

      // Apply brand color
      const brand = config.brandColor || '#FF5A1F';
      document.documentElement.style.setProperty('--brand', brand);

      // Logo or biz name
      const logoContainer = document.getElementById('logo-container');
      if (config.logoUrl) {
        logoContainer.innerHTML = `<img src="${config.logoUrl}" alt="${config.bizName}" class="logo-img">`;
      } else if (config.bizName && config.bizName !== 'Us') {
        logoContainer.innerHTML = `<div class="biz-name-fallback">${config.bizName}</div>`;
      }

      // Greeting
      if (name) {
        const greetEl = document.getElementById('greeting');
        greetEl.textContent = `Hi ${name},`;
        greetEl.style.display = 'block';
      }

      // Heading
      const headingEl = document.getElementById('heading');
      if (service) {
        headingEl.textContent = `How was your ${service}?`;
      } else {
        headingEl.textContent = `How was your experience with ${config.bizName}?`;
      }

      // Show rating state
      showState('state-rating');
    }

    init();

    // Stars interaction
    const stars = document.querySelectorAll('.star');

    stars.forEach(star => {
      star.addEventListener('mouseenter', () => {
        const val = parseInt(star.dataset.value);
        stars.forEach(s => {
          s.classList.toggle('filled', parseInt(s.dataset.value) <= val);
        });
      });

      star.addEventListener('click', () => {
        selectedRating = parseInt(star.dataset.value);
        if (selectedRating >= 4) {
          // Fire tracking in background
          if (cid && lid) {
            fetch('/functions/review-click', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ cid, lid, rating: selectedRating })
            }).catch(() => {});
          }
          // Redirect to Google or show thank you
          if (config.googleUrl) {
            window.location.href = config.googleUrl;
          } else {
            showState('state-thanks');
          }
        } else {
          showState('state-unhappy');
        }
      });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
      stars.forEach(s => s.classList.remove('filled'));
    });

    // Show/hide states
    function showState(id) {
      document.querySelectorAll('.state').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // Feedback submit
    document.getElementById('btn-feedback').addEventListener('click', async () => {
      const reason = document.getElementById('feedback-reason').value;
      const feedbackName = document.getElementById('feedback-name').value.trim();
      const feedbackEmail = document.getElementById('feedback-email').value.trim();
      const feedbackText = document.getElementById('feedback').value.trim();
      const errorEl = document.getElementById('feedback-error');
      const btn = document.getElementById('btn-feedback');

      errorEl.style.display = 'none';
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res = await fetch('/functions/review-feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cid,
            lid,
            rating: selectedRating,
            reason,
            name: feedbackName,
            email: feedbackEmail,
            feedback: feedbackText
          })
        });

        if (res.ok) {
          showState('state-thanks');
        } else {
          errorEl.textContent = 'Something went wrong. Please try again.';
          errorEl.style.display = 'block';
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      } catch (e) {
        errorEl.textContent = 'Something went wrong. Please try again.';
        errorEl.style.display = 'block';
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
