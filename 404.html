<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Scale National</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      background: #0D0D0D;
      font-family: 'Urbanist', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 40px 20px;
    }
    .wrap { max-width: 480px; }
    h1 { font-size: 72px; font-weight: 800; color: #FF5A1F; margin-bottom: 12px; }
    p { font-size: 18px; color: #aaa; margin-bottom: 32px; line-height: 1.5; }
    a {
      display: inline-block;
      background: #FF5A1F;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      transition: background 0.2s;
    }
    a:hover { background: #e04a10; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
