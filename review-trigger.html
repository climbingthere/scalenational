    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Send Review Request — Scale National</title>

    <!-- PWA / Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Reviews">
    <meta name="theme-color" content="#0D0D0D">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #0D0D0D;
            color: #ffffff;
            font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            min-height: 100dvh;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo img {
            height: 32px;
            opacity: 0.9;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .logo-text span {
            color: #FF5A1F;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            color: #999;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }

        input:focus, textarea:focus {
            border-color: #FF5A1F;
        }

        input::placeholder, textarea::placeholder {
            color: #555;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: #FF5A1F;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Success state */
        .success-state {
            display: none;
            text-align: center;
            padding: 40px 0;
        }

        .success-state.visible {
            display: block;
        }

        .success-check {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .success-state h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .success-state p {
            font-size: 15px;
            color: #888;
            margin-bottom: 28px;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid #333;
            color: #aaa;
        }

        .btn-reset:active {
            background: #1a1a1a;
        }

        /* Error */
        .error-msg {
            display: none;
            color: #FF5A1F;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            font-weight: 500;
        }

        .error-msg.visible {
            display: block;
        }

        .form-state { display: block; }
        .form-state.hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">
        <div class="logo-text">SCALE <span>NATIONAL</span></div>
    </div>

    <!-- Form State -->
    <div class="form-state" id="formState">
        <h1>Send Review Request</h1>

        <form id="reviewForm" autocomplete="off">
            <div class="form-group">
                <label for="firstName">First Name *</label>
                <input type="text" id="firstName" name="firstName" placeholder="Customer first name" required autocapitalize="words">
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" placeholder="Customer last name" autocapitalize="words">
            </div>

            <div class="form-group">
                <label for="phone">Phone *</label>
                <input type="tel" id="phone" name="phone" placeholder="(555) 555-5555" required inputmode="tel">
            </div>

            <div class="form-group">
                <label for="notes">Job Notes <span style="color:#555;text-transform:none;font-weight:400;">(optional)</span></label>
                <textarea id="notes" name="notes" placeholder="e.g. Replaced water heater, 123 Main St"></textarea>
            </div>

            <button type="submit" class="btn" id="submitBtn">Send Review Request</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
    </div>

    <!-- Success State -->
    <div class="success-state" id="successState">
        <div class="success-check">&#10003;</div>
        <h2 id="successName">Review request sent!</h2>
        <p>The review sequence has been triggered in your system.</p>
        <button class="btn btn-reset" onclick="resetForm()">Send Another</button>
    </div>
</div>

<script>
    const form = document.getElementById('reviewForm');
    const formState = document.getElementById('formState');
    const successState = document.getElementById('successState');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.classList.remove('visible');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';

        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const notes = document.getElementById('notes').value.trim();

        if (!firstName || !phone) {
            showError('First name and phone are required.');
            return;
        }

        try {
            const res = await fetch('/review-trigger', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ firstName, lastName, phone, notes }),
            });

            const data = await res.json();

            if (!res.ok || !data.ok) {
                throw new Error(data.error || 'Something went wrong');
            }

            // Show success
            const name = data.name || firstName;
            document.getElementById('successName').textContent = 'Review request sent to ' + name;
            formState.classList.add('hidden');
            successState.classList.add('visible');
        } catch (err) {
            showError(err.message || 'Failed to send. Check your connection and try again.');
        }
    });

    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Review Request';
    }

    function resetForm() {
        form.reset();
        errorMsg.classList.remove('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Review Request';
        successState.classList.remove('visible');
        formState.classList.remove('hidden');
        document.getElementById('firstName').focus();
    }
</script>

</body>
</html>
